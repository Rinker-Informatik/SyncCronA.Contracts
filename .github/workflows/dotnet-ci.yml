name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Clean
        run: dotnet clean dotnet/SyncCronA.Contracts.Unittests/SyncCronA.Contracts.Unittests.csproj --configuration Release

      - name: Restore
        run: dotnet restore dotnet/SyncCronA.Contracts.Unittests/SyncCronA.Contracts.Unittests.csproj

      - name: Build
        run: dotnet build dotnet/SyncCronA.Contracts.Unittests/SyncCronA.Contracts.Unittests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test dotnet/SyncCronA.Contracts.Unittests/SyncCronA.Contracts.Unittests.csproj --configuration Release --no-build --no-restore
